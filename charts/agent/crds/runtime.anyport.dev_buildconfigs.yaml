---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: buildconfigs.runtime.anyport.dev
spec:
  group: runtime.anyport.dev
  names:
    kind: BuildConfig
    listKind: BuildConfigList
    plural: buildconfigs
    singular: buildconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.statusEmoji
      name: Status
      type: string
    - jsonPath: .status.checksCompleted
      name: Checks
      type: string
    - jsonPath: .spec.buildMode
      name: Mode
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: BuildConfig is the Schema for the buildconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BuildConfig
            properties:
              autoDeploy:
                description: |-
                  AutoDeploy when true triggers a new BuildRun automatically on git push (via webhook).
                  Defaults to false; opt-in per app.
                type: boolean
              autoRollout:
                description: AutoRollout configures optional ContainerApp update after
                  success
                properties:
                  containerAppRef:
                    type: string
                  projectRef:
                    type: string
                required:
                - containerAppRef
                - projectRef
                type: object
              buildMode:
                description: BuildMode specifies the build strategy (Auto, Buildpack,
                  Dockerfile)
                type: string
              buildParams:
                description: BuildParams controls optional build parameters
                properties:
                  buildArgs:
                    additionalProperties:
                      type: string
                    type: object
                  buildEnv:
                    additionalProperties:
                      type: string
                    description: |-
                      BuildEnv is the repository's build-time environment, used when building without a
                      Dockerfile. It reaches the builder twice, because it is needed for two different things:
                      to decide what the repository *is* (RAILPACK_SPA_OUTPUT_DIR makes a single-page app be
                      served as a static site), and to run the build's own commands. It is delivered to the
                      build as a mounted secret rather than a build argument, so a value cannot end up in an
                      image layer. The Dockerfile path uses BuildArgs instead.
                    type: object
                  cacheEnabled:
                    type: boolean
                  dockerfilePath:
                    type: string
                  resources:
                    description: |-
                      Resources optionally overrides the build container's resource envelope. Unset means the
                      envelope is derived from the cluster's own nodes at trigger time.
                    properties:
                      cpuRequest:
                        description: CPURequest is the CPU reserved for the build,
                          e.g. "500m".
                        type: string
                      ephemeralStorageLimit:
                        description: EphemeralStorageLimit is the ceiling past which
                          the build is evicted for disk, e.g. "20Gi".
                        type: string
                      ephemeralStorageRequest:
                        description: |-
                          EphemeralStorageRequest is the disk reserved for the build's context, layer cache and
                          snapshot store, e.g. "4Gi".
                        type: string
                      memoryLimit:
                        description: MemoryLimit is the ceiling past which the build
                          is OOM-killed, e.g. "4Gi".
                        type: string
                      memoryRequest:
                        description: MemoryRequest is the memory reserved for the
                          build, e.g. "1Gi".
                        type: string
                    type: object
                  targetStage:
                    type: string
                type: object
              clusterRef:
                description: ClusterRef references the cluster where this resource
                  is deployed
                type: string
              containerAppProjectRef:
                description: |-
                  ContainerAppProjectRef is the project of the linked container app.
                  Must be set if ContainerAppRef is set. Stored with distinct bson key to avoid
                  conflicting with CommonMetadata.ProjectRef (cluster-scoping field).
                type: string
              containerAppRef:
                description: |-
                  ContainerAppRef is an optional reference to the container app this build config belongs to.
                  When set, the build config is scoped to that container app and auto-rollout is implied.
                type: string
              description:
                description: Description provides additional context about the resource
                type: string
              destinationImage:
                description: DestinationImage is the full image ref to push (e.g.
                  registry/repo:tag-template)
                type: string
              displayName:
                description: DisplayName is a human-readable name for the resource
                type: string
              dockerCreds:
                description: DockerCreds holds registry credentials
                properties:
                  password:
                    type: string
                  registry:
                    type: string
                  secretRef:
                    type: string
                  username:
                    type: string
                required:
                - registry
                type: object
              gitSource:
                description: |-
                  GitSource describes the repository to build from.

                  The bson tags here and on BuildGitSource are explicit and lowercase on purpose: the
                  mongo driver lowercases untagged Go field names, so these documents have always been
                  stored as `spec.gitsource.repourl`. Naming the keys freezes that (no migration) and
                  stops anyone writing a query against the camelCase JSON name, which silently matches
                  nothing — that bug disabled auto-deploy entirely. See buildconfig_bson_test.go.
                properties:
                  authType:
                    type: string
                  branch:
                    type: string
                  credentialRef:
                    type: string
                  repoURL:
                    type: string
                  subPath:
                    type: string
                required:
                - authType
                - branch
                - repoURL
                type: object
              projectRef:
                description: ProjectRef references the project this resource belongs
                  to
                type: string
            required:
            - destinationImage
            - dockerCreds
            - gitSource
            type: object
          status:
            description: status defines the observed state of BuildConfig
            properties:
              checksCompleted:
                type: string
              events:
                description: Events holds recent Warning events for the resource's
                  workload, collected best-effort. Optional.
                items:
                  description: EventInfo holds recent Warning events for the resource's
                    workload (best-effort).
                  properties:
                    count:
                      format: int32
                      type: integer
                    lastSeen:
                      type: string
                    message:
                      type: string
                    object:
                      type: string
                    reason:
                      type: string
                  required:
                  - reason
                  type: object
                type: array
              hold:
                description: Hold is what the rollout is waiting for, nil when nothing
                  holds it. Optional.
                properties:
                  blocked:
                    description: Blocked is true when the dependency is failing rather
                      than still coming up.
                    type: boolean
                  kind:
                    description: Kind is service or app.
                    type: string
                  name:
                    type: string
                  reason:
                    description: Reason is the hold in the user's terms.
                    type: string
                  since:
                    description: |-
                      Since is when this dependency first held the rollout, RFC3339. Kept across reconciles so
                      the grace and the deadline are measured from the first hold, not the last look.
                    type: string
                required:
                - kind
                - name
                type: object
              message:
                type: string
              nextRunAt:
                description: NextRunAt is when a scheduled resource fires next, RFC3339.
                  Optional.
                type: string
              observedGeneration:
                description: ObservedGeneration is the console desired-state version
                  (anyport.dev/generation) that Phase/Reason describe.
                format: int64
                type: integer
              observedRunId:
                description: |-
                  ObservedRunID is the one-off run request the controller has already acted on. Without it a
                  resync re-applying the same spec would start the run again. Optional.
                type: string
              phase:
                description: Phase is the derived workload health (e.g., Running,
                  Crashing, ImageError).
                type: string
              pods:
                description: Pods holds basic pod details for display (e.g. ContainerApp
                  overview). Optional.
                items:
                  description: PodInfo holds basic pod details; Reason/Message surface
                    container waiting/terminated state.
                  properties:
                    cause:
                      description: |-
                        Cause is why the pod is not running, as one word (see ContainerCause), and Detail the
                        sentence for it: "Out of memory: the container went past its 256Mi limit". Both come from
                        the container's last termination when its current state is a back-off, which is the case a
                        reader of Reason alone gets wrong.
                      type: string
                    createdAt:
                      description: CreatedAt is when the pod was created, RFC3339.
                      type: string
                    detail:
                      type: string
                    exitCode:
                      description: ExitCode is the main container's last, when it
                        ran at all.
                      format: int32
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                    ready:
                      type: string
                    reason:
                      type: string
                    restartCount:
                      format: int32
                      type: integer
                    role:
                      description: |-
                        Role says whether the pod belongs to the Deployment's current template ("current") or
                        to an earlier one still running through a rollout ("previous"). Empty when unknown.
                      type: string
                    templateGeneration:
                      description: |-
                        TemplateGeneration is the console's desired-state version the pod's template carries — the
                        one that last changed the template, so a publish that changed nothing a pod would notice
                        does not restart it. The console maps it to the revision it shows. Zero for pods made
                        before the agent stamped templates.
                      format: int64
                      type: integer
                  required:
                  - name
                  - phase
                  - ready
                  - restartCount
                  type: object
                type: array
              reason:
                description: Reason is a plain-language explanation of Phase.
                type: string
              rollout:
                description: Rollout is the workload's rollout in progress, nil when
                  there is none. Optional.
                properties:
                  desired:
                    description: |-
                      Desired is the replica count; Ready how many current pods are ready; Previous how many
                      pods of an earlier template are still running.
                    format: int32
                    type: integer
                  previous:
                    format: int32
                    type: integer
                  previousGeneration:
                    format: int64
                    type: integer
                  ready:
                    format: int32
                    type: integer
                  reason:
                    description: |-
                      Reason is why the current pods are not coming up, in words, when State is failed or
                      stalled.
                    type: string
                  startedAt:
                    description: StartedAt is when the first pod of the current template
                      was created, RFC3339.
                    type: string
                  state:
                    description: State is starting, progressing, stalled or failed.
                    type: string
                  templateGeneration:
                    description: |-
                      TemplateGeneration is the current template's; PreviousGeneration the newest one still
                      serving.
                    format: int64
                    type: integer
                required:
                - desired
                - previous
                - ready
                - state
                type: object
              runs:
                description: Runs holds recent executions of a run-to-completion resource
                  (e.g. a Task). Optional.
                items:
                  description: |-
                    RunInfo is one execution of something that runs to completion — today a Task's run, and the
                    same shape a BuildRun would need. Timestamps are RFC3339 strings, matching EventInfo, so the
                    status stays plain JSON the console can render without a type in between.
                  properties:
                    cause:
                      description: Cause is why the run failed as one word (ContainerCause),
                        and Detail the sentence for it.
                      type: string
                    detail:
                      type: string
                    events:
                      description: |-
                        Events are the Warning events of a failed run's pods, captured while the pod still
                        exists: the pod is pruned with the Job, and with it the only explanation of an OOM, a pull
                        failure or a node that could not fit it.
                      items:
                        description: EventInfo holds recent Warning events for the
                          resource's workload (best-effort).
                        properties:
                          count:
                            format: int32
                            type: integer
                          lastSeen:
                            type: string
                          message:
                            type: string
                          object:
                            type: string
                          reason:
                            type: string
                        required:
                        - reason
                        type: object
                      type: array
                    exitCode:
                      description: |-
                        ExitCode is the main container's, when the pod reported one. A Job condition says a run
                        failed; the exit code is the first thing the person who wrote the command asks for.
                      format: int32
                      type: integer
                    finishedAt:
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                    reason:
                      type: string
                    startedAt:
                      type: string
                    trigger:
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              services:
                description: Services holds service details for the resource (e.g.
                  HelmApp release services) for domain/route backend selection. Optional.
                items:
                  description: ServiceInfo holds service details for display and domain
                    backend selection.
                  properties:
                    name:
                      type: string
                    ports:
                      items:
                        description: ServicePortInfo holds a single port exposed by
                          a service (for domain/route backend selection).
                        properties:
                          name:
                            type: string
                          port:
                            format: int32
                            type: integer
                          protocol:
                            type: string
                        required:
                        - port
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                type: array
              status:
                type: string
              statusEmoji:
                type: string
              steps:
                items:
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    status:
                      type: string
                  required:
                  - message
                  - name
                  - status
                  type: object
                type: array
            required:
            - status
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
