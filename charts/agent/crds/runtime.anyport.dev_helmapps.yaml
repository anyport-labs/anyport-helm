---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: helmapps.runtime.anyport.dev
spec:
  group: runtime.anyport.dev
  names:
    kind: HelmApp
    listKind: HelmAppList
    plural: helmapps
    singular: helmapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.statusEmoji
      name: Status
      type: string
    - jsonPath: .status.checksCompleted
      name: Checks
      type: string
    - jsonPath: .spec.chart
      name: Chart
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: HelmApp is the Schema for the helmapps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HelmApp
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: Annotations for additional metadata
                type: object
              chart:
                description: Chart specifies the Helm chart name or path
                type: string
              clusterRef:
                description: ClusterRef references the cluster where this resource
                  is deployed
                type: string
              createNamespace:
                description: CreateNamespace indicates whether to create the namespace
                type: boolean
              description:
                description: Description provides additional context about the resource
                type: string
              displayName:
                description: DisplayName is a human-readable name for the resource
                type: string
              exposeToOtherProjects:
                description: |-
                  ExposeToOtherProjects is the deprecated form of ExposeToProjects: true meant "share with
                  whatever the Project's allowIngressFromProjects lists". It is still honoured when
                  ExposeToProjects is empty, and nothing writes it.

                  Deprecated: set ExposeToProjects instead.
                type: boolean
              exposeToProjects:
                description: |-
                  ExposeToProjects names the projects allowed to reach this release's pods across the
                  network-isolation baseline. Empty — the default — means no other project can.

                  It stands on its own: the project-level allowIngressFromProjects list is not consulted, so
                  sharing one app is one edit in one place. See docs/network-isolation §5.
                items:
                  type: string
                type: array
              labels:
                additionalProperties:
                  type: string
                description: Labels for additional metadata
                type: object
              namespace:
                description: Namespace where the release will be installed
                type: string
              projectRef:
                description: ProjectRef references the project this resource belongs
                  to
                type: string
              releaseName:
                description: ReleaseName is the name of the Helm release
                type: string
              repository:
                description: Repository specifies the Helm repository URL
                type: string
              upgradeCRDs:
                description: |-
                  UpgradeCRDs applies the chart's crds/ directory on upgrade, which Helm itself never does.

                  Helm installs crds/ on first install and then leaves it alone forever, deliberately: a CRD
                  replacement can break every object of that kind on the cluster, so the CLI makes it the
                  operator's decision. That is the right default and the wrong one for a chart the *platform*
                  installs and version-pins on the user's behalf — bumping such a chart would upgrade the
                  controller and leave the CRDs it was written against behind, permanently.

                  Off unless asked, and asked only by definitions whose operator ships CRDs that way (Percona's
                  ps-operator does; CloudNativePG templates its CRDs, so a plain upgrade already carries them).
                  See docs/databases/mysql-bake/README.md.
                type: boolean
              values:
                additionalProperties:
                  type: string
                description: Values contains the values to pass to the chart
                type: object
              valuesFrom:
                description: ValuesFrom references external sources for values
                items:
                  description: ValuesFromSource represents a source for values
                  properties:
                    configMapKeyRef:
                      description: ConfigMapKeyRef references a key in a ConfigMap
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    secretKeyRef:
                      description: SecretKeyRef references a key in a Secret
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  type: object
                type: array
              valuesYaml:
                description: ValuesYaml contains the raw YAML string of values to
                  pass to the chart
                type: string
              version:
                description: Version specifies the chart version
                type: string
            required:
            - chart
            type: object
          status:
            description: status defines the observed state of HelmApp
            properties:
              checksCompleted:
                type: string
              events:
                description: Events holds recent Warning events for the resource's
                  workload, collected best-effort. Optional.
                items:
                  description: EventInfo holds recent Warning events for the resource's
                    workload (best-effort).
                  properties:
                    count:
                      format: int32
                      type: integer
                    lastSeen:
                      type: string
                    message:
                      type: string
                    object:
                      type: string
                    reason:
                      type: string
                  required:
                  - reason
                  type: object
                type: array
              hold:
                description: Hold is what the rollout is waiting for, nil when nothing
                  holds it. Optional.
                properties:
                  blocked:
                    description: Blocked is true when the dependency is failing rather
                      than still coming up.
                    type: boolean
                  kind:
                    description: Kind is service or app.
                    type: string
                  name:
                    type: string
                  reason:
                    description: Reason is the hold in the user's terms.
                    type: string
                  since:
                    description: |-
                      Since is when this dependency first held the rollout, RFC3339. Kept across reconciles so
                      the grace and the deadline are measured from the first hold, not the last look.
                    type: string
                required:
                - kind
                - name
                type: object
              message:
                type: string
              nextRunAt:
                description: NextRunAt is when a scheduled resource fires next, RFC3339.
                  Optional.
                type: string
              observedGeneration:
                description: ObservedGeneration is the console desired-state version
                  (anyport.dev/generation) that Phase/Reason describe.
                format: int64
                type: integer
              observedRunId:
                description: |-
                  ObservedRunID is the one-off run request the controller has already acted on. Without it a
                  resync re-applying the same spec would start the run again. Optional.
                type: string
              phase:
                description: Phase is the derived workload health (e.g., Running,
                  Crashing, ImageError).
                type: string
              pods:
                description: Pods holds basic pod details for display (e.g. ContainerApp
                  overview). Optional.
                items:
                  description: PodInfo holds basic pod details; Reason/Message surface
                    container waiting/terminated state.
                  properties:
                    cause:
                      description: |-
                        Cause is why the pod is not running, as one word (see ContainerCause), and Detail the
                        sentence for it: "Out of memory: the container went past its 256Mi limit". Both come from
                        the container's last termination when its current state is a back-off, which is the case a
                        reader of Reason alone gets wrong.
                      type: string
                    createdAt:
                      description: CreatedAt is when the pod was created, RFC3339.
                      type: string
                    detail:
                      type: string
                    exitCode:
                      description: ExitCode is the main container's last, when it
                        ran at all.
                      format: int32
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                    ready:
                      type: string
                    reason:
                      type: string
                    restartCount:
                      format: int32
                      type: integer
                    role:
                      description: |-
                        Role says whether the pod belongs to the Deployment's current template ("current") or
                        to an earlier one still running through a rollout ("previous"). Empty when unknown.
                      type: string
                    templateGeneration:
                      description: |-
                        TemplateGeneration is the console's desired-state version the pod's template carries — the
                        one that last changed the template, so a publish that changed nothing a pod would notice
                        does not restart it. The console maps it to the revision it shows. Zero for pods made
                        before the agent stamped templates.
                      format: int64
                      type: integer
                  required:
                  - name
                  - phase
                  - ready
                  - restartCount
                  type: object
                type: array
              reason:
                description: Reason is a plain-language explanation of Phase.
                type: string
              rollout:
                description: Rollout is the workload's rollout in progress, nil when
                  there is none. Optional.
                properties:
                  desired:
                    description: |-
                      Desired is the replica count; Ready how many current pods are ready; Previous how many
                      pods of an earlier template are still running.
                    format: int32
                    type: integer
                  previous:
                    format: int32
                    type: integer
                  previousGeneration:
                    format: int64
                    type: integer
                  ready:
                    format: int32
                    type: integer
                  reason:
                    description: |-
                      Reason is why the current pods are not coming up, in words, when State is failed or
                      stalled.
                    type: string
                  startedAt:
                    description: StartedAt is when the first pod of the current template
                      was created, RFC3339.
                    type: string
                  state:
                    description: State is starting, progressing, stalled or failed.
                    type: string
                  templateGeneration:
                    description: |-
                      TemplateGeneration is the current template's; PreviousGeneration the newest one still
                      serving.
                    format: int64
                    type: integer
                required:
                - desired
                - previous
                - ready
                - state
                type: object
              runs:
                description: Runs holds recent executions of a run-to-completion resource
                  (e.g. a Task). Optional.
                items:
                  description: |-
                    RunInfo is one execution of something that runs to completion — today a Task's run, and the
                    same shape a BuildRun would need. Timestamps are RFC3339 strings, matching EventInfo, so the
                    status stays plain JSON the console can render without a type in between.
                  properties:
                    cause:
                      description: Cause is why the run failed as one word (ContainerCause),
                        and Detail the sentence for it.
                      type: string
                    detail:
                      type: string
                    events:
                      description: |-
                        Events are the Warning events of a failed run's pods, captured while the pod still
                        exists: the pod is pruned with the Job, and with it the only explanation of an OOM, a pull
                        failure or a node that could not fit it.
                      items:
                        description: EventInfo holds recent Warning events for the
                          resource's workload (best-effort).
                        properties:
                          count:
                            format: int32
                            type: integer
                          lastSeen:
                            type: string
                          message:
                            type: string
                          object:
                            type: string
                          reason:
                            type: string
                        required:
                        - reason
                        type: object
                      type: array
                    exitCode:
                      description: |-
                        ExitCode is the main container's, when the pod reported one. A Job condition says a run
                        failed; the exit code is the first thing the person who wrote the command asks for.
                      format: int32
                      type: integer
                    finishedAt:
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                    reason:
                      type: string
                    startedAt:
                      type: string
                    trigger:
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              services:
                description: Services holds service details for the resource (e.g.
                  HelmApp release services) for domain/route backend selection. Optional.
                items:
                  description: ServiceInfo holds service details for display and domain
                    backend selection.
                  properties:
                    name:
                      type: string
                    ports:
                      items:
                        description: ServicePortInfo holds a single port exposed by
                          a service (for domain/route backend selection).
                        properties:
                          name:
                            type: string
                          port:
                            format: int32
                            type: integer
                          protocol:
                            type: string
                        required:
                        - port
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                type: array
              status:
                type: string
              statusEmoji:
                type: string
              steps:
                items:
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    status:
                      type: string
                  required:
                  - message
                  - name
                  - status
                  type: object
                type: array
            required:
            - status
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
