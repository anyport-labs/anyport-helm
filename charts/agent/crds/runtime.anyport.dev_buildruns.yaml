---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: buildruns.runtime.anyport.dev
spec:
  group: runtime.anyport.dev
  names:
    kind: BuildRun
    listKind: BuildRunList
    plural: buildruns
    singular: buildrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.buildMode
      name: Mode
      type: string
    - jsonPath: .spec.buildConfigRef
      name: BuildConfig
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: BuildRun is the Schema for the buildruns API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BuildRun
            properties:
              autoRollout:
                description: AutoRollout is the snapshot of the rollout config
                properties:
                  containerAppRef:
                    type: string
                  projectRef:
                    type: string
                required:
                - containerAppRef
                - projectRef
                type: object
              buildConfigRef:
                description: BuildConfigRef is the name of the parent BuildConfig
                type: string
              buildMode:
                description: BuildMode specifies what engine to use (resolved at trigger
                  time)
                type: string
              buildParams:
                description: BuildParams is the snapshot of build parameters
                properties:
                  buildArgs:
                    additionalProperties:
                      type: string
                    type: object
                  buildEnv:
                    additionalProperties:
                      type: string
                    description: |-
                      BuildEnv is the repository's build-time environment, used when building without a
                      Dockerfile. It reaches the builder twice, because it is needed for two different things:
                      to decide what the repository *is* (RAILPACK_SPA_OUTPUT_DIR makes a single-page app be
                      served as a static site), and to run the build's own commands. It is delivered to the
                      build as a mounted secret rather than a build argument, so a value cannot end up in an
                      image layer. The Dockerfile path uses BuildArgs instead.
                    type: object
                  cacheEnabled:
                    type: boolean
                  dockerfilePath:
                    type: string
                  resources:
                    description: |-
                      Resources optionally overrides the build container's resource envelope. Unset means the
                      envelope is derived from the cluster's own nodes at trigger time.
                    properties:
                      cpuRequest:
                        description: CPURequest is the CPU reserved for the build,
                          e.g. "500m".
                        type: string
                      ephemeralStorageLimit:
                        description: EphemeralStorageLimit is the ceiling past which
                          the build is evicted for disk, e.g. "20Gi".
                        type: string
                      ephemeralStorageRequest:
                        description: |-
                          EphemeralStorageRequest is the disk reserved for the build's context, layer cache and
                          snapshot store, e.g. "4Gi".
                        type: string
                      memoryLimit:
                        description: MemoryLimit is the ceiling past which the build
                          is OOM-killed, e.g. "4Gi".
                        type: string
                      memoryRequest:
                        description: MemoryRequest is the memory reserved for the
                          build, e.g. "1Gi".
                        type: string
                    type: object
                  targetStage:
                    type: string
                type: object
              clusterRef:
                description: ClusterRef references the cluster where this resource
                  is deployed
                type: string
              description:
                description: Description provides additional context about the resource
                type: string
              destinationImage:
                description: DestinationImage is the resolved full image tag to push
                  (e.g. registry/repo:main-1234abc)
                type: string
              displayName:
                description: DisplayName is a human-readable name for the resource
                type: string
              dockerCreds:
                description: DockerCreds is the snapshot of the credentials used for
                  this run
                properties:
                  password:
                    type: string
                  registry:
                    type: string
                  secretRef:
                    type: string
                  username:
                    type: string
                required:
                - registry
                type: object
              gitSource:
                description: GitSource is the snapshot of the git config used for
                  this run
                properties:
                  authType:
                    type: string
                  branch:
                    type: string
                  credentialRef:
                    type: string
                  repoURL:
                    type: string
                  subPath:
                    type: string
                required:
                - authType
                - branch
                - repoURL
                type: object
              projectRef:
                description: ProjectRef references the project this resource belongs
                  to
                type: string
            required:
            - buildConfigRef
            - buildMode
            - destinationImage
            - dockerCreds
            - gitSource
            type: object
          status:
            description: status defines the observed state of BuildRun
            properties:
              builderRef:
                description: BuilderRef is the name of the Job doing the work
                type: string
              builderVersion:
                description: |-
                  BuilderVersion is the Railpack release that planned a source build. Recorded because
                  detection is the part of a source build that changes between releases: when a repository
                  that built last week stops building, this is the first thing worth comparing.
                type: string
              commitSha:
                description: CommitSHA is the resolved git commit SHA for this build
                type: string
              commitShortSha:
                description: CommitShortSHA is the short (7-char) git commit SHA
                type: string
              detectedProviders:
                description: |-
                  DetectedProviders is what the builder decided this repository is, when it was built
                  without a Dockerfile — "node", "python", "staticfile". Empty for a Dockerfile build,
                  which detects nothing, and empty when the builder's output could not be read, because a
                  wrong answer here is worse than none.
                items:
                  type: string
                type: array
              finishedAt:
                description: FinishedAt is when the build completed or failed
                format: date-time
                type: string
              imageDigest:
                description: ImageDigest is the sha256 digest of the successfully
                  built image
                type: string
              logStreamID:
                description: LogStreamID is used to stream live logs from the pod
                type: string
              message:
                description: Message contains additional error or progress information
                type: string
              phase:
                description: Phase is the current state of the build
                type: string
              startedAt:
                description: StartedAt is when the build began
                format: date-time
                type: string
              subPhase:
                description: SubPhase gives finer-grained progress detail while Phase
                  == Building
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
