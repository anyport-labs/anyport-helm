{{/*
The stable ClusterIP Service apps connect to. Its name is the release name, which is what
domain/plugins/tei.go builds the connection secret's HOST from — keep the two in step.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anyport-tei.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyport-tei.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "anyport-tei.selectorLabels" . | nindent 4 }}
---
{{/* Headless Service required by the StatefulSet for stable pod DNS. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anyport-tei.headlessName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyport-tei.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "anyport-tei.selectorLabels" . | nindent 4 }}
