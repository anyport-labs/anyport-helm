{{/*
The proxy's whole configuration, mounted over the image's conf.d. See proxy in values.yaml for
why it exists.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anyport-chromium.proxyConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyport-chromium.labels" . | nindent 4 }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen {{ .Values.service.port }};
      # Every readiness probe would otherwise be a log line.
      access_log off;

      location / {
        proxy_pass http://127.0.0.1:{{ .Values.debuggingPort }};
        proxy_http_version 1.1;
        # An IP literal is the form the browser accepts. It is also the address the browser
        # writes into the WebSocket URLs it returns, which the sub_filters below swap for the
        # Host the client sent, so a client that follows webSocketDebuggerUrl comes back here.
        proxy_set_header Host 127.0.0.1:{{ .Values.debuggingPort }};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # sub_filter cannot rewrite a compressed body.
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout {{ .Values.proxy.idleTimeout }};
        proxy_send_timeout {{ .Values.proxy.idleTimeout }};

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'ws://127.0.0.1:{{ .Values.debuggingPort }}/' 'ws://$http_host/';
        sub_filter 'ws=127.0.0.1:{{ .Values.debuggingPort }}/' 'ws=$http_host/';
      }
    }
